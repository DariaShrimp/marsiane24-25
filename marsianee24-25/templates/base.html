<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/media/logo.png">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="static/js/connect_styles.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .nav-link { color: white; }
        .nav-link:hover { color: var(--purple-primary); }
        .nav-item.active .nav-link { color: var(--purple-active); }
        .navbar-toggler-icon { background-color: white; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md my-nav py-3 px-5">
    <a class="navbar-brand d-flex align-items-center brand-logo" href="/">
        <span class="h4 mb-0" style="color: var(--purple-primary);">Yeti</span>
    </a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="background-color: white;">
        <span class="navbar-toggler-icon" style="background-color: white;"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown2" role="button" data-bs-toggle="dropdown">Карты</a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown2">
                    <li><a class="dropdown-item" href="/map">Поверхность</a></li>
                    <li><a class="dropdown-item" href="/full">Full</a></li>
                    <li><a class="dropdown-item" href="/module">Модули</a></li>
                    <li><a class="dropdown-item" href="/station">Станции</a></li>
                    <li><a class="dropdown-item" href="/coverage">Станции и покрытия</a></li>
                </ul>
            </li>
        </ul>
    </div>
</nav>
<script>
document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', function() {
        document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
<br>
<div class="p-2">
    {% block main_content %}{% endblock %}
</div>
<footer class="text-center py-4">
    <div class="container">
        <div class="row row-cols-1">
            <div class="col"><p class="text-muted my-2">©Men, 2025</p></div>
            <div class="col">
                <ul class="list-inline my-2">
                    <li class="list-inline-item"><a class="link-dark" href="https://rutube.ru/video/c6cc4d620b1d4338901770a44b3e82f4/?r=wd">Пасхалка 1</a></li>
                    <li class="list-inline-item"><a class="link-dark" href="https://vkvideo.ru/video-122455412_456247462">Пасхалка 2</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
</body>
</html>
